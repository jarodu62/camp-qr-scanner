<!DOCTYPE html>
<html>
<head>
  <title>Camp QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    #qr-reader { width: 100%; max-width: 500px; margin: auto; }
    #status { margin-top: 20px; font-size: 18px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
    .mode-btn { margin: 5px; padding: 10px 16px; font-size: 16px; }
    .active { background-color: #4CAF50; color: white; }
  </style>
</head>
<body>
  <h1>Camp QR Scanner</h1>

  <div>
    <button id="btn-checkin" class="mode-btn active" onclick="setMode('checkin')">Check In</button>
    <button id="btn-checkout" class="mode-btn" onclick="setMode('checkout')">Check Out</button>
  </div>

  <div id="qr-reader"></div>
  <div id="status">Mode: Check In — Waiting for scan...</div>

  <div id="checkout-colors" style="display:none; margin-top:20px;">
  <div>Select Checkout Group</div>

  <div id="color-grid" style="
    display:grid;
    grid-template-columns:repeat(5,50px);
    gap:10px;
    justify-content:center;
    margin-top:10px;">
  </div>
</div>

  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxxajiHSYZyfWYQ4YIHhYh-TL50goL1_TrtPRc3QcEH8kVxz0L5EV_RXEtq4yx5k7Sw4w/exec";
    let scanning = true;
    let mode = "checkin";

    function setMode(newMode) {
      mode = newMode;
      document.getElementById("btn-checkin").classList.toggle("active", mode === "checkin");
      document.getElementById("btn-checkout").classList.toggle("active", mode === "checkout");
      document.getElementById("status").innerText =
        `Mode: ${mode === "checkin" ? "Check In" : "Check Out"} — Waiting for scan...`;
    }

    function onScanSuccess(decodedText) {
      if (!scanning) return;
      scanning = false;

      const statusEl = document.getElementById("status");
      statusEl.className = "";

      let camper;
      try {
        camper = JSON.parse(decodedText);
      } catch (e) {
        statusEl.innerText = "❌ Invalid QR code!";
        statusEl.className = "error";
        reset();
        return;
      }

      statusEl.innerText = `Scanning ${camper.first} ${camper.last}...`;

      const first = encodeURIComponent(camper.first);
      const last = encodeURIComponent(camper.last);
      const sheet = encodeURIComponent(camper.sheet);

      fetch(`${webAppUrl}?first=${first}&last=${last}&sheet=${sheet}&mode=${mode}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            statusEl.innerText = `✅ ${data.message}`;
            statusEl.className = "success";
          } else {
            statusEl.innerText = `❌ ${data.message}`;
            statusEl.className = "error";
          }
        })
        .catch(err => {
          statusEl.innerText = `❌ Error scanning ${camper.first} ${camper.last}`;
          statusEl.className = "error";
          console.error(err);
        })
        .finally(reset);
    }

    function reset() {
      setTimeout(() => {
        scanning = true;
        document.getElementById("status").innerText =
          `Mode: ${mode === "checkin" ? "Check In" : "Check Out"} — Waiting for scan...`;
        document.getElementById("status").className = "";
      }, 2000);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "qr-reader",
      { fps: 10, qrbox: 250 },
      false
    );

    html5QrcodeScanner.render(onScanSuccess, () => {});
  </script>
</body>
</html>


<script>

const checkoutColors = [
  {name:"blue", hex:"#0066ff"},
  {name:"red", hex:"#ff0000"},
  {name:"tan", hex:"#d2b48c"},
  {name:"brown", hex:"#8b4513"},
  {name:"gray", hex:"#808080"},
  {name:"orange", hex:"#ff8800"},
  {name:"purple", hex:"#8000ff"},
  {name:"green", hex:"#00aa00"},
  {name:"lightblue", hex:"#87ceeb"},
  {name:"lightgreen", hex:"#90ee90"}
];

let selectedCheckoutColor = null;

function initializeCheckoutColors() {

  const grid = document.getElementById("color-grid");

  checkoutColors.forEach(color => {

    const btn = document.createElement("button");

    btn.style.width = "50px";
    btn.style.height = "50px";
    btn.style.background = color.hex;
    btn.style.border = "3px solid transparent";
    btn.style.cursor = "pointer";

    btn.onclick = () => {

      document
        .querySelectorAll(".color-selected")
        .forEach(el=>{
          el.classList.remove("color-selected");
          el.style.border="3px solid transparent";
        });

      btn.classList.add("color-selected");
      btn.style.border="3px solid black";

      selectedCheckoutColor = color.hex;

    };

    grid.appendChild(btn);

  });

}

initializeCheckoutColors();

const originalSetMode = setMode;

setMode = function(newMode){

  originalSetMode(newMode);

  document.getElementById("checkout-colors").style.display =
    newMode === "checkout"
      ? "block"
      : "none";

};

const originalScan = onScanSuccess;

onScanSuccess = function(decodedText){

  if (
    mode === "checkout" &&
    !selectedCheckoutColor
  ) {

    document.getElementById("status").innerText =
      "❌ Select a checkout color first";

    document.getElementById("status").className =
      "error";

    return;

  }

  const originalFetch = window.fetch;

  window.fetch = function(url,...args){

    return originalFetch(url,...args)
      .then(async res=>{

        const clone = res.clone();

        try{

          const data =
            await clone.json();

          if(
            mode==="checkout" &&
            data.status==="success"
          ){

            let camper =
              JSON.parse(decodedText);

            originalFetch(
              `${webAppUrl}?action=checkoutOrder`
              + `&first=${encodeURIComponent(camper.first)}`
              + `&last=${encodeURIComponent(camper.last)}`
              + `&color=${encodeURIComponent(selectedCheckoutColor)}`
            );

          }

        }catch(e){}

        return res;

      });

  };

  originalScan(decodedText);

};

</script>
