<!DOCTYPE html>
<html>
<head>
  <title>Camp QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;

      /* 🔥 FIX: lock layout order */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .mode-btn {
      margin: 5px;
      padding: 10px 16px;
      font-size: 16px;
    }

    .active {
      background-color: #4CAF50;
      color: white;
    }

    #checkout-panel {
      display: none;
      margin-top: 10px;
    }

    #color-grid {
      display: grid;
      grid-template-columns: repeat(5, 50px);
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .color-btn {
      width: 50px;
      height: 50px;
      border: 3px solid transparent;
      cursor: pointer;
    }

    .selected {
      border: 4px solid black;
    }

    /* 🔥 FIX: force scanner order */
    #checkout-panel { order: 1; }
    #qr-reader { order: 2; width: 100%; max-width: 500px; height: 400px; }
    #status { order: 3; font-size: 18px; font-weight: bold; margin-top: 10px; }

    #qr-reader {
      overflow: hidden;
      margin: auto;
    }

    .success { color: green; }
    .error { color: red; }

  </style>
</head>

<body>

<h1>Camp QR Scanner</h1>

<div>
  <button id="btn-checkin" class="mode-btn active" onclick="setMode('checkin')">Check In</button>
  <button id="btn-checkout" class="mode-btn" onclick="setMode('checkout')">Check Out</button>
</div>

<div id="checkout-panel">
  <div>Select Checkout Color</div>
  <div id="color-grid"></div>
</div>

<div id="qr-reader"></div>

<div id="status">Mode: Check In — Waiting for scan...</div>

<script>

const webAppUrl =
"https://script.google.com/macros/s/AKfycbyb1lqhegT4A-_YVXEyMe85hwhdsNe45yOxoCahzvSn6979UU_SOYSPWLyam2JuYa7deQ/exec";

let scanning = true;
let mode = "checkin";
let selectedCheckoutColor = "";

const colors = [
  "#0066ff",
  "#ff0000",
  "#d2b48c",
  "#8b4513",
  "#808080",
  "#ff8800",
  "#8000ff",
  "#00aa00",
  "#87ceeb",
  "#90ee90"
];

// ---------- COLOR GRID ----------
function buildColors() {
  const grid = document.getElementById("color-grid");

  colors.forEach(color => {
    const btn = document.createElement("button");
    btn.className = "color-btn";
    btn.style.background = color;

    btn.onclick = () => {
      selectedCheckoutColor = color;

      document.querySelectorAll(".color-btn").forEach(b => {
        b.classList.remove("selected");
      });

      btn.classList.add("selected");
    };

    grid.appendChild(btn);
  });
}

buildColors();

// ---------- MODE SWITCH ----------
function setMode(newMode) {
  mode = newMode;

  document.getElementById("btn-checkin")
    .classList.toggle("active", mode === "checkin");

  document.getElementById("btn-checkout")
    .classList.toggle("active", mode === "checkout");

  document.getElementById("checkout-panel").style.display =
    mode === "checkout" ? "block" : "none";

  document.getElementById("status").innerText =
    `Mode: ${mode === "checkin" ? "Check In" : "Check Out"} — Waiting for scan...`;
}

// ---------- SCAN ----------
function onScanSuccess(decodedText) {
  if (!scanning) return;

  if (mode === "checkout" && !selectedCheckoutColor) {
    document.getElementById("status").innerText =
      "❌ Select a checkout color first";
    document.getElementById("status").className = "error";
    return;
  }

  scanning = false;

  const statusEl = document.getElementById("status");
  statusEl.className = "";

  let camper;

  try {
    camper = JSON.parse(decodedText);
  } catch {
    statusEl.innerText = "❌ Invalid QR code!";
    statusEl.className = "error";
    reset();
    return;
  }

  statusEl.innerText = `Scanning ${camper.first} ${camper.last}...`;

  const url =
    `${webAppUrl}` +
    `?first=${encodeURIComponent(camper.first)}` +
    `&last=${encodeURIComponent(camper.last)}` +
    `&sheet=${encodeURIComponent(camper.sheet)}` +
    `&mode=${mode}` +
    `&color=${encodeURIComponent(selectedCheckoutColor)}`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      statusEl.innerText =
        data.status === "success"
          ? `✅ ${data.message}`
          : `❌ ${data.message}`;

      statusEl.className =
        data.status === "success" ? "success" : "error";
    })
    .catch(err => {
      console.error(err);
      statusEl.innerText = "❌ Network error";
      statusEl.className = "error";
    })
    .finally(reset);
}

// ---------- RESET ----------
function reset() {
  setTimeout(() => {
    scanning = true;
    document.getElementById("status").innerText =
      `Mode: ${mode === "checkin" ? "Check In" : "Check Out"} — Waiting for scan...`;
    document.getElementById("status").className = "";
  }, 2000);
}

// ---------- INIT SCANNER ----------
const html5QrcodeScanner =
  new Html5QrcodeScanner("qr-reader", {
    fps: 10,
    qrbox: 250
  }, false);

html5QrcodeScanner.render(onScanSuccess, () => {});

</script>

</body>
</html>
