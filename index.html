<!DOCTYPE html>
<html>
<head>
  <title>Camp QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    #qr-reader { width: 100%; max-width: 500px; margin: auto; }
    #status { margin-top: 20px; font-size: 18px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
    .mode-btn { margin: 5px; padding: 10px 16px; font-size: 16px; }
    .active { background-color: #4CAF50; color: white; }
  </style>
</head>
<body>
  <h1>Camp QR Scanner</h1>

  <div>
    <button id="btn-checkin" class="mode-btn active" onclick="setMode('checkin')">Check In</button>
    <button id="btn-checkout" class="mode-btn" onclick="setMode('checkout')">Check Out</button>
  </div>

  <div id="qr-reader"></div>
  <div id="status">Mode: Check In — Waiting for scan...</div>


  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxxajiHSYZyfWYQ4YIHhYh-TL50goL1_TrtPRc3QcEH8kVxz0L5EV_RXEtq4yx5k7Sw4w/exec";
    let scanning = true;
    let mode = "checkin";

    function setMode(newMode) {
      mode = newMode;
      document.getElementById("btn-checkin").classList.toggle("active", mode === "checkin");
      document.getElementById("btn-checkout").classList.toggle("active", mode === "checkout");
      document.getElementById("status").innerText =
        `Mode: ${mode === "checkin" ? "Check In" : "Check Out"} — Waiting for scan...`;
    }

    function onScanSuccess(decodedText) {
      if (!scanning) return;
      scanning = false;

      const statusEl = document.getElementById("status");
      statusEl.className = "";

      let camper;
      try {
        camper = JSON.parse(decodedText);
      } catch (e) {
        statusEl.innerText = "❌ Invalid QR code!";
        statusEl.className = "error";
        reset();
        return;
      }

      statusEl.innerText = `Scanning ${camper.first} ${camper.last}...`;

      const first = encodeURIComponent(camper.first);
      const last = encodeURIComponent(camper.last);
      const sheet = encodeURIComponent(camper.sheet);

      fetch(`${webAppUrl}?first=${first}&last=${last}&sheet=${sheet}&mode=${mode}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            statusEl.innerText = `✅ ${data.message}`;
            statusEl.className = "success";
          } else {
            statusEl.innerText = `❌ ${data.message}`;
            statusEl.className = "error";
          }
        })
        .catch(err => {
          statusEl.innerText = `❌ Error scanning ${camper.first} ${camper.last}`;
          statusEl.className = "error";
          console.error(err);
        })
        .finally(reset);
    }

    function reset() {
      setTimeout(() => {
        scanning = true;
        document.getElementById("status").innerText =
          `Mode: ${mode === "checkin" ? "Check In" : "Check Out"} — Waiting for scan...`;
        document.getElementById("status").className = "";
      }, 2000);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "qr-reader",
      { fps: 10, qrbox: 250 },
      false
    );

    html5QrcodeScanner.render(onScanSuccess, () => {});
  </script>
</body>
</html>




<script>

const checkoutColors = [
  "#0066ff", // blue
  "#ff0000", // red
  "#d2b48c", // tan
  "#8b4513", // brown
  "#808080", // gray
  "#ff8800", // orange
  "#8000ff", // purple
  "#00aa00", // green
  "#87ceeb", // light blue
  "#90ee90"  // light green
];

let selectedCheckoutColor = "";

function createCheckoutButtons() {

  if (document.getElementById("checkout-colors")) return;

  const container = document.createElement("div");

  container.id = "checkout-colors";

  container.style.display = "none";
  container.style.marginTop = "20px";

  container.innerHTML = `
    <div style="margin-bottom:10px;">
      Select Checkout Color
    </div>

    <div id="color-grid"
      style="
        display:grid;
        grid-template-columns:repeat(5,50px);
        gap:10px;
        justify-content:center;">
    </div>
  `;

  document.body.appendChild(container);

  const grid =
    document.getElementById("color-grid");

  checkoutColors.forEach(color => {

    const btn =
      document.createElement("button");

    btn.style.width = "50px";
    btn.style.height = "50px";
    btn.style.background = color;

    btn.onclick = () => {

      selectedCheckoutColor =
        color;

      document
        .querySelectorAll(".color-btn")
        .forEach(b =>
          b.style.border =
            "2px solid transparent"
        );

      btn.style.border =
        "4px solid black";

    };

    btn.className =
      "color-btn";

    grid.appendChild(btn);

  });

}

createCheckoutButtons();

const oldSetMode = setMode;

setMode = function(newMode){

  oldSetMode(newMode);

  const colors =
    document.getElementById(
      "checkout-colors"
    );

  colors.style.display =
    newMode === "checkout"
      ? "block"
      : "none";

};

const oldOnScan =
  onScanSuccess;

onScanSuccess =
function(decodedText){

  if (
    mode === "checkout" &&
    !selectedCheckoutColor
  ){

    document.getElementById(
      "status"
    ).innerText =
      "❌ Select a color first";

    return;

  }

  oldOnScan(decodedText);

};

</script>
